# One-command setup:  docker compose up --build
# Then open http://localhost:5173  (API docs: http://localhost:8000/docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docrepo
      POSTGRES_PASSWORD: docrepo
      POSTGRES_DB: docrepo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrepo -d docrepo"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://docrepo:docrepo@db:5432/docrepo
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:5173
    # Seeds demo data on first start only (skipped when documents already exist).
    command: sh -c "python -m seed.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
